name: Problem in the app
description: Something in Droid Atlas doesn't work or looks broken.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Open Search.
        2. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 142
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How you use Droid Atlas
      options:
        - In a browser tab
        - Installed on the home screen
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Site build
      description: Open About, then Data health. Next to Site build, select the copy button, then paste here.
      placeholder: a1b2c3d
  - type: input
    id: catalog
    attributes:
      label: Catalog build
      description: On the same page, select the copy button next to Catalog build, then paste here.
      placeholder: 70eb86091e0c22ef
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Drag an image here.
