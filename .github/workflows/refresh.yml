name: Daily refresh

# Off until release: every job is skipped unless the repository variable
# REFRESH_ENABLED is "true". docs/RELEASE.md lists every switch.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL }}
  REFRESH_BOOTSTRAP: ${{ vars.REFRESH_BOOTSTRAP }}
  PROJECT_URL: ${{ vars.PROJECT_URL }}
  DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
  MAX_AGE_DAYS: "3"

jobs:
  build:
    name: Build and check
    if: vars.REFRESH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      config: ${{ steps.config.outcome }}
      unit: ${{ steps.unit.outcome }}
      mirror: ${{ steps.mirror.outcome }}
      pipeline: ${{ steps.pipeline.outcome }}
      app: ${{ steps.app.outcome }}
      site: ${{ steps.site.outcome }}
      e2e: ${{ steps.e2e.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - id: config
        name: Check the switches
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
        run: node scripts/refresh-config.mjs

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      # Before any catalog or upstream cache is in the checkout: these test the
      # code. What the day's catalog is worth is the validation gates' to say.
      - id: unit
        name: Unit tests
        run: pnpm run test

      - name: Restore the upstream cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: upstream-${{ github.run_id }}
          restore-keys: upstream-

      - id: mirror
        name: Previous good build from the live site
        run: |
          bootstrap=()
          if [ "$REFRESH_BOOTSTRAP" = "true" ]; then bootstrap=(--bootstrap); fi
          node scripts/live-build.mjs mirror --site "$SITE_URL" --out app/public/data "${bootstrap[@]}"

      - id: pipeline
        name: Build the catalog (validation gates decide)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--previous app/public/data)
          if [ "$REFRESH_BOOTSTRAP" = "true" ]; then args=(--bootstrap); fi
          if [ -n "$PROJECT_URL" ]; then args+=(--project-url "$PROJECT_URL"); fi
          args+=(--project-contact hello@droidatlas.app)
          node pipeline/build.ts "${args[@]}"

      - name: Save the upstream cache
        if: always() && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: upstream-${{ github.run_id }}

      - name: Build report
        if: always() && hashFiles('app/public/data/report.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: |
            app/public/data/report.json
            app/public/data/report.md
          retention-days: 30

      - id: app
        name: Build the app
        run: pnpm --filter ./app run build

      - id: site
        name: Assemble and check the site
        run: |
          node scripts/third-party-licenses.mjs --filter ./app --dist app/dist \
            --out "$RUNNER_TEMP/third-party-licenses.txt"
          node scripts/assemble-site.mjs --app-dist app/dist \
            --third-party "$RUNNER_TEMP/third-party-licenses.txt" --out "$RUNNER_TEMP/site"
          node scripts/leak-scan.mjs --root "$RUNNER_TEMP/site" --site

      - id: e2e
        name: End-to-end journeys against the built site
        if: hashFiles('tests/e2e/package.json') != ''
        env:
          E2E_SITE_DIR: ${{ runner.temp }}/site
        run: |
          pnpm --filter ./tests/e2e exec playwright install --with-deps chromium
          pnpm run test:e2e

      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
          if-no-files-found: error
          retention-days: 7

  deploy-github-pages:
    name: Deploy (GitHub Pages)
    needs: build
    if: >-
      vars.REFRESH_ENABLED == 'true' && vars.DEPLOY_TARGET == 'github-pages'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write # creates the Pages deployment
      id-token: write # proves to Pages that this workflow is the one deploying
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-cloudflare-workers:
    name: Deploy (Cloudflare Workers)
    needs: build
    if: >-
      vars.REFRESH_ENABLED == 'true' && vars.DEPLOY_TARGET == 'cloudflare-workers'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: cloudflare-workers
    env:
      WRANGLER_VERSION: "4.152.0"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
    steps:
      - name: Require the Cloudflare configuration
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_WORKER_NAME; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured"; missing=1; fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site

      - name: Write the Worker configuration
        run: node scripts/wrangler-config.mjs --assets "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/wrangler.json"

      - name: Publish
        run: >-
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy
          --config "$RUNNER_TEMP/wrangler.json" --message "refresh $GITHUB_SHA"

  freshness:
    name: Live catalog freshness
    needs: [build, deploy-github-pages, deploy-cloudflare-workers]
    if: always() && vars.REFRESH_ENABLED == 'true' && vars.SITE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      message: ${{ steps.age.outputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - id: age
        name: Fail if the live catalog is older than the limit
        run: |
          set +e
          message=$(node scripts/live-build.mjs age --site "$SITE_URL" --max-age-days "$MAX_AGE_DAYS" 2>&1)
          status=$?
          set -e
          echo "$message"
          { echo "message<<MESSAGE_END"; echo "$message"; echo "MESSAGE_END"; } >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then echo "::error::$message"; fi
          exit "$status"

  report:
    name: Open, update or close the failure issue
    needs: [build, deploy-github-pages, deploy-cloudflare-workers, freshness]
    if: always() && vars.REFRESH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # opens, updates and closes the failure issue
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FRESHNESS: ${{ needs.freshness.outputs.message }}
      OUTCOMES: >-
        {"config": "${{ needs.build.outputs.config }}",
         "unit": "${{ needs.build.outputs.unit }}",
         "mirror": "${{ needs.build.outputs.mirror }}",
         "pipeline": "${{ needs.build.outputs.pipeline }}",
         "app": "${{ needs.build.outputs.app }}",
         "site": "${{ needs.build.outputs.site }}",
         "e2e": "${{ needs.build.outputs.e2e }}",
         "deploy": "${{ vars.DEPLOY_TARGET == 'github-pages' && needs.deploy-github-pages.result || vars.DEPLOY_TARGET == 'cloudflare-workers' && needs.deploy-cloudflare-workers.result || 'skipped' }}",
         "freshness": "${{ needs.freshness.result }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: report
          path: report

      - name: Report
        run: |
          node scripts/refresh-report.mjs --outcomes "$OUTCOMES" --report report/report.json \
            --freshness "$FRESHNESS" --run-url "$RUN_URL" > "$RUNNER_TEMP/result.json"
          label=refresh-failure
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state open --json number --jq '.[].number')
          if [ "$(jq -r .ok "$RUNNER_TEMP/result.json")" = "true" ]; then
            for number in $open; do
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The daily refresh succeeded again: $RUN_URL"
            done
            exit 0
          fi
          title=$(jq -r .title "$RUNNER_TEMP/result.json")
          jq -r .body "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/body.md"
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The daily catalog refresh is failing" --force
          number=$(echo "$open" | head -n 1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title"
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "$label" --body-file "$RUNNER_TEMP/body.md"
          fi
          echo "::error::$title"
          exit 1

  keepalive:
    name: Keep the schedule enabled
    if: vars.REFRESH_ENABLED == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # keeps this workflow's schedule enabled
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-enable this workflow
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/refresh.yml/enable"
